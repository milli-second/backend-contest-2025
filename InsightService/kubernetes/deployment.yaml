apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightservice
  labels:
    app: insightservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insightservice
  template:
    metadata:
      labels:
        app: insightservice
    spec:
      containers:
        - name: insightservice
          image: "username/insightservice:latest"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
