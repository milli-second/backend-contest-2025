apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightservice-test
  labels:
    app: insightservice-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insightservice-test
  template:
    metadata:
      labels:
        app: insightservice-test
    spec:
      containers:
        - name: insightservice
          image: "username/insightservice:test-latest"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
