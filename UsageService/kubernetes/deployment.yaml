apiVersion: apps/v1
kind: Deployment
metadata:
  name: usageservice
  labels:
    app: usageservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usageservice
  template:
    metadata:
      labels:
        app: usageservice
    spec:
      containers:
        - name: usageservice
          image: "username/usageservice:latest"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
