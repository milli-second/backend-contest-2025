server:
  port: 8083

spring:
  application:
    name: usageservice

  # 로컬 테스트용 H2 메모리 DB
  datasource:
    url: jdbc:h2:mem:usage;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create        #로컬에서만 사용
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

  #H2 콘솔 열기
  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    stream:
      bindings:
        screenData-out-0:
          destination: usage_events
          contentType: application/json
      kafka:
        binder:
          brokers: localhost:9092

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
