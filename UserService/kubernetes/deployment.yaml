apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice-test
  namespace: screentimeai-test   # Namespace 지정
  labels:
    app: userservice-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice-test
  template:
    metadata:
      labels:
        app: userservice-test
    spec:
      containers:
        - name: userservice
          image: "username/userservice:test-latest"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
