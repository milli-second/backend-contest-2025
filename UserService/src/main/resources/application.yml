server:
  port: 8081

spring:
  application:
    name: userservice
---

spring:
  config:
    activate:
      on-profile: default
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      function:
        definition: eventConsumer
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        eventConsumer-in-0:
          destination: screentimeai
          group: userservice
          contentType: application/json
        userEventOutput:
          destination: screentimeai
          contentType: application/json

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug


server:
  port: 8081

---

spring:
  config:
    activate:
      on-profile: docker
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      function:
        definition: eventConsumer
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        eventConsumer-in-0:
          destination: screentimeai
          group: userservice
          contentType: application/json
        userEventOutput:
          destination: screentimeai
          contentType: application/json


