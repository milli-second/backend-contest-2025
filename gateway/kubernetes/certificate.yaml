apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: millisecond-cert-test
  namespace: istio-system  # ⚠️ Istio Ingress Gateway가 접근할 수 있는 namespace
spec:
  # 생성될 TLS Secret의 이름 (Gateway에서 참조)
  secretName: millisecond-tls-test

  # 어떤 ClusterIssuer를 사용할지
  issuerRef:
    name: letsencrypt-staging-test
    kind: ClusterIssuer

  # 인증서를 발급받을 도메인
  dnsNames:
  - "test-api.yolang.shop" # ⭐️ 테스트용 도메인으로 변경
