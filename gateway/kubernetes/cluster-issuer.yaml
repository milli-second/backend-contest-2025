apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-test
spec:
  acme:
    # ⭐️ 중요: Let's Encrypt의 Staging(테스트) 서버 주소로 변경
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    # 인증서 만료 알림을 받을 이메일
    email: crispylemon7120@gmail.com

    # Let's Encrypt 계정의 개인 키를 저장할 Secret 이름
    privateKeySecretRef:
      name: letsencrypt-staing-private-key-test

    # HTTP-01 Challenge 방식
    # Let's Encrypt가 http://api.yolang.shop/.well-known/acme-challenge/xxx 로 검증
    solvers:
    - http01:
        ingress:
          class: istio  # Istio Ingress Gateway 사용
