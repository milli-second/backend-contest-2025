apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-test
  namespace: screentimeai-test # ⭐️ Namespace 지정
  labels:
    app: gateway-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-test
  template:
    metadata:
      labels:
        app: gateway-test
    spec:
      containers:
        - name: gateway
          image: username/gateway:test-latest
          ports:
            - containerPort: 8080
