apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: millisecond-gateway-test
  namespace: screentimeai-test      # ⭐️ Namespace 변경
spec:
  selector:
    istio: ingressgateway  # Istio의 기본 Ingress Gateway Pod 선택
  servers:
  # HTTP 서버 (HTTPS로 자동 리다이렉트)
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "test-api.yolang.shop" # ⭐️ 테스트용 도메인으로 변경
    tls:
      httpsRedirect: true  # HTTP → HTTPS 자동 리다이렉트

  # HTTPS 서버
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "test-api.yolang.shop" # ⭐️ 테스트용 도메인으로 변경
    tls:
      mode: SIMPLE  # 단방향 TLS (서버 → 클라이언트)
      credentialName: millisecond-tls-test  # certificate.yaml에서 생성한 Secret 이름
