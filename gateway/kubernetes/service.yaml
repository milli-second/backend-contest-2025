apiVersion: v1
kind: Service
metadata:
  name: gatewaytest
  namespace: screentimeai-test # ⭐️ Namespace 지정
  labels:
    app: gateway-test
spec:
  type: ClusterIP  # LoadBalancer → ClusterIP (Istio가 트래픽 관리)
  ports:
    - port: 8080
      targetPort: 8080
      name: http  # Istio를 위한 port name 추가
  selector:
    app: gateway-test