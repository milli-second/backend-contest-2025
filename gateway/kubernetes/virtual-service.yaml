apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: millisecond-virtualservice-test
  namespace: screentimeai-test             # ⭐️ Namespace 변경
spec:
  hosts:
  - "test-api.yolang.shop" # ⭐️ 테스트용 도메인으로 변경
  gateways:
  - millisecond-gateway-test # ⭐️ 위에서 수정한 Gateway 이름으로 변경
  http:
  - match:
    - uri:
        prefix: /users
    route:
    - destination:
        host: userservice-test.screentimeai-test.svc.cluster.local
        port:
          number: 8080

  - match:
    - uri:
        prefix: /usage
    route:
    - destination:
        host: usageservice-test.screentimeai-test.svc.cluster.local
        port:
          number: 8080

  # InsightService
  - match:
    - uri:
        prefix: /insights
    route:
    - destination:
        host: insightservice-test.screentimeai-test.svc.cluster.local
        port:
          number: 8080
