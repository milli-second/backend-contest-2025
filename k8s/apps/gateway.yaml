apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config-test
  namespace: screentimeai-test
data:
  USERSERVICE_URI: "http://userservice-test.screentimeai-test.svc.cluster.local:8080"
  USAGESERVICE_URI: "http://usageservice-test.screentimeai-test.svc.cluster.local:8080"
  INSIGHTSERVICE_URI: "http://insightservice-test.screentimeai-test.svc.cluster.local:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-test
  namespace: screentimeai-test
spec:
  selector:
    app: gateway-test
  ports:
    - port: 8088
      targetPort: 8088
      name: http
      nodePort: 300889  # ⭐️ 중요: 기존 포트(30088)와 충돌하지 않도록 변경
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-test
  namespace: screentimeai-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-test
  template:
    metadata:
      labels:
        app: gateway-test
    spec:
      containers:
      - name: gateway
        image: laylaoh/gateway:test-latest-amd64
        imagePullPolicy: Always
        ports:
        - containerPort: 8088
          name: http
        env:
        - name: USERSERVICE_URI
          valueFrom:
            configMapKeyRef:
              name: gateway-config-test
              key: USERSERVICE_URI
        - name: USAGESERVICE_URI
          valueFrom:
            configMapKeyRef:
              name: gateway-config-test
              key: USAGESERVICE_URI
        - name: INSIGHTSERVICE_URI
          valueFrom:
            configMapKeyRef:
              name: gateway-config-test
              key: INSIGHTSERVICE_URI
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
