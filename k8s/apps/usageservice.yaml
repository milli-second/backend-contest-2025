apiVersion: v1
kind: ConfigMap
metadata:
  name: usageservice-config-test
  namespace: screentimeai-test
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://usageservice-postgres-test-0.usageservice-postgres-test.db-test.svc.cluster.local:5432/usageservice_db"
  SPRING_DATA_REDIS_HOST: "redis-test-0.redis-test.db-test.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "1"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-test-0.kafka-test.db-test.svc.cluster.local:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: usageservice-test
  namespace: screentimeai-test
spec:
  selector:
    app: usageservice-test
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usageservice-test
  namespace: screentimeai-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usageservice-test
  template:
    metadata:
      labels:
        app: usageservice-test
    spec:
      containers:
      - name: usageservice-test
        image: laylaoh/usageservice-test:latest-amd64
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: usageservice-config-test
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: usageservice-config-test
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: usageservice-db-secret-test
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: usageservice-db-secret-test
              key: POSTGRES_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: usageservice-config-test
              key: SPRING_DATA_REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: usageservice-config-test
              key: SPRING_DATA_REDIS_PORT
        - name: SPRING_DATA_REDIS_DATABASE
          valueFrom:
            configMapKeyRef:
              name: usageservice-config-test
              key: SPRING_DATA_REDIS_DATABASE
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret-test
              key: REDIS_PASSWORD
        - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
          valueFrom:
            configMapKeyRef:
              name: usageservice-config-test
              key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        resources:
          requests:
            memory: "384Mi"
            cpu: "300m"
          limits:
            memory: "768Mi"
            cpu: "700m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
